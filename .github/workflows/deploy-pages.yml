name: Deploy a GitHub Pages

on:
  push:
    branches:
      - main
      - claude/awesome-cray-uqhl3x
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Si Pages sigue configurado en "Deploy from a branch", GitHub lanza su propio
      # publicado (sin compilar) en cada push. Esperamos a que termine para que el
      # sitio compilado quede siempre como la última versión publicada.
      - name: Esperar al publicado automático de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$pending" = "0" ]; then echo "Sin publicados pendientes."; exit 0; fi
            echo "Esperando a 'pages build and deployment' ($i)..."; sleep 5
          done
          echo "Tiempo de espera agotado, se publica igual."

      - id: deployment
        uses: actions/deploy-pages@v4
