<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Página no encontrada — Marketing Master HUB</title>
    <script>
      // GitHub Pages no tiene fallback de SPA: cualquier ruta que no existe cae acá.
      // Si la ruta es /gracias (con o sin barra final), redirige a gracias.html
      // conservando los parámetros que agregue la pasarela de pago.
      (function () {
        var l = window.location
        var m = l.pathname.match(/^(.*?\/)gracias(\.html)?\/?$/i)
        if (m) l.replace(m[1] + 'gracias.html' + l.search + l.hash)
      })()
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a202c; color: #cbd2dc; font: 16px/1.5 Lato, system-ui, sans-serif; text-align: center; padding: 1rem; }
      h1 { color: #fff; font-size: 1.5rem; margin: 0 0 .5rem; }
      a { color: #85b5f5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Página no encontrada</h1>
      <p>La dirección que buscas no existe.</p>
      <p><a id="home" href="/">Ir a Marketing Master HUB</a></p>
    </main>
    <script>
      // En github.io el sitio vive bajo /<repo>/; en un dominio propio, en la raíz.
      if (/\.github\.io$/.test(location.hostname)) {
        document.getElementById('home').href = '/' + location.pathname.split('/')[1] + '/'
      }
    </script>
  </body>
</html>
